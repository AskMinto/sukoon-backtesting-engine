[project]
name = "sukoon-bt"
version = "0.0.1"
description = "Event-driven mutual fund backtesting CLI for the Sukoon data API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "AskMinto" }]
keywords = ["backtesting", "mutual-funds", "quant", "cli", "sukoon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "polars>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "httpx>=0.27",
    "orjson>=3.10",
    "pyyaml>=6.0",
    "diskcache>=5.6",
    "pluggy>=1.5",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
sukoon-bt = "sukoon_bt.cli.app:app"

[project.urls]
Homepage = "https://github.com/AskMinto/sukoon-backtesting-engine"
Repository = "https://github.com/AskMinto/sukoon-backtesting-engine"
Issues = "https://github.com/AskMinto/sukoon-backtesting-engine/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sukoon_bt"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use blind pytest.raises(Exception) when verifying that
# typer.BadParameter (which inherits from click.exceptions.UsageError) gets
# raised — different typer versions emit different concrete subtypes.
"tests/*" = ["B017"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
