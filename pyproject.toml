[project]
name = "sukoon-bt"
version = "0.0.1"
description = "Event-driven mutual fund backtesting CLI for the Sukoon data API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "AskMinto" }]
keywords = ["backtesting", "mutual-funds", "quant", "cli", "sukoon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AskMinto/sukoon-backtesting-engine"
Repository = "https://github.com/AskMinto/sukoon-backtesting-engine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sukoon_bt"]
