name: Top-3 Flexi-Cap Momentum

capital:
  initial: 100000
  sip: 10000

universe:
  category: "Flexi Cap"
  limit: 30           # cap how many funds the search returns

signal:
  type: momentum
  params:
    lookback_days: 180
    top_n: 3

